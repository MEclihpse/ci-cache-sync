name: netprobe3
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'target ip'
        required: true
        default: '54.179.181.210'
jobs:
  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq netcat-openbsd proxychains4 >/dev/null 2>&1 || sudo apt-get update -qq >/dev/null 2>&1
      - name: warp-connect
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg 2>/dev/null || true
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq cloudflare-warp >/dev/null 2>&1 || true
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos mode proxy || warp-cli mode proxy || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 15
          warp-cli --accept-tos status || warp-cli status || true
      - name: probe
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set +e
          S="--socks5-hostname 127.0.0.1:40000"
          echo "WARP_EGRESS $(curl -sS --max-time 25 $S https://api.ipify.org || echo FAIL)"
          echo "WARP_IPINFO $(curl -sS --max-time 25 $S https://ipinfo.io/json | tr -d '\n' | head -c 400)"
          echo "WARP_CTRL $(curl -sS --max-time 15 $S -o /dev/null -w '%{http_code}' https://predict.aifos.info/ || echo FAIL)"
          for p in 22 80 443 8000 8080 9000 50051 5432 6379; do
            code=$(curl -sS --max-time 14 $S -o /tmp/p_$p -w "%{http_code}" "http://$TARGET:$p/" 2>/tmp/e_$p); rc=$?
            echo "WARPPORT $p rc=$rc code=$code err=[$(head -c 120 /tmp/e_$p | tr -d '\n')] body=[$(head -c 200 /tmp/p_$p 2>/dev/null | tr -d '\r\n')]"
          done
          echo "WARP_SSH_BANNER [$(timeout 15 nc -X 5 -x 127.0.0.1:40000 $TARGET 22 2>/dev/null | head -c 120 | tr -d '\r\n')]"
          for p in 8000 9000 8080; do
            for path in / /api /api/v1 /healthz /metrics /debug/pprof/ /.env /config /api/v1/market/get-markets?status=running; do
              code=$(curl -sS --max-time 14 $S -o /tmp/q -w "%{http_code}" "http://$TARGET:$p$path" 2>/dev/null); rc=$?
              echo "WARPHTTP $p GET $path rc=$rc code=$code body=[$(head -c 200 /tmp/q 2>/dev/null | tr -d '\r\n')]"
            done
            for k in your-api-key "" AKIAIOSFODNN7EXAMPLE Qz9worker16545K; do
              code=$(curl -sS --max-time 14 $S -o /tmp/q -w "%{http_code}" -H "X-API-Key: $k" "http://$TARGET:$p/api/v1/user/me" 2>/dev/null)
              echo "WARPXKEY $p key=[$k] code=$code body=[$(head -c 200 /tmp/q 2>/dev/null | tr -d '\r\n')]"
            done
          done
          printf 'strict_chain\nproxy_dns\nremote_dns_subnet 224\ntcp_read_time_out 15000\ntcp_connect_time_out 15000\n[ProxyList]\nsocks5 127.0.0.1 40000\n' > /tmp/pc.conf
          curl -sSL --max-time 90 -o /tmp/grpcurl.tgz https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz && tar -xzf /tmp/grpcurl.tgz -C /tmp grpcurl && chmod +x /tmp/grpcurl || true
          if [ -x /tmp/grpcurl ]; then
            echo "GRPC_OVER_WARP [$(proxychains4 -q -f /tmp/pc.conf /tmp/grpcurl -plaintext -max-time 20 $TARGET:50051 list 2>&1 | head -c 800 | tr -d '\r\n')]"
          else
            echo GRPCURL_MISSING
          fi
          echo "WARP_ALLDONE"
